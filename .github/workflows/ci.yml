name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma/onnx_models
          key: chroma-onnx-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/ scripts/ streamlit_app.py
          ruff format --check src/ tests/ scripts/ streamlit_app.py

      # Tests that need the real Kaggle dataset, trained models or a Gemini key skip themselves;
      # the pipeline, forecasting and assistant code is covered by synthetic-data tests.
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short -rs \
            --cov=src/data_pipeline --cov=src/forecasting --cov=src/rag_assistant --cov=src/utils --cov=src/analytics \
            --cov-report=term --cov-report=xml --cov-fail-under=70

      - name: Check imports
        run: |
          python -c "from src.utils.config import PROJECT_ROOT; print('Config OK')"
          python -c "from src.utils.db import get_connection; print('DB module OK')"
          python -c "from src.data_pipeline.ingest import ingest_supply_chain; print('Ingest OK')"
          python -c "from src.forecasting.train import FEATURE_COLS; print('Train OK')"
          python -c "from src.rag_assistant.chat import chat; print('Assistant OK')"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: opsbrain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
