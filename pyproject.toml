[project]
name = "opsbrain"
version = "0.1.0"
description = "AI-Powered Supply Chain Analytics & RAG Assistant"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llm: end-to-end tests that call the Gemini API (need GOOGLE_API_KEY)",
]
